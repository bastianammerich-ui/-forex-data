name: Build AI Forex Feed

on:
  push:
    branches: [main]
    paths:
      - forex.json
      - ai_feed_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ai-forex-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Build compact per-pair/per-timeframe feeds
        shell: python
        run: |
          import json
          import pathlib
          import shutil
          import subprocess

          source_path = pathlib.Path("forex.json")
          if not source_path.exists():
              raise SystemExit("forex.json not found")

          with source_path.open("r", encoding="utf-8") as fh:
              src = json.load(fh)

          if not src.get("success"):
              raise SystemExit("forex.json reports success=false")

          try:
              source_commit = subprocess.check_output(
                  ["git", "log", "-1", "--format=%H", "--", "forex.json"],
                  text=True,
              ).strip()
          except Exception:
              source_commit = None

          market = src.get("market", {})
          # 220 H1 bars are sufficient to reconstruct >60 completed 3H bars for v3.
          limits = {
              "15min": 40,
              "1h": 220,
              "4h": 60,
              "1day": 60,
          }

          pairs = set()
          for tf in limits:
              pairs.update(market.get(tf, {}).get("pairs", {}).keys())

          outdir = pathlib.Path("ai_feed")
          if outdir.exists():
              shutil.rmtree(outdir)
          outdir.mkdir(parents=True, exist_ok=True)

          files = {}
          for pair in sorted(pairs):
              files[pair] = {}
              safe_pair = pair.replace("/", "")

              for tf, limit in limits.items():
                  tf_block = market.get(tf, {})
                  pair_block = tf_block.get("pairs", {}).get(pair)
                  if not pair_block:
                      continue

                  complete = [
                      candle for candle in pair_block.get("candles", [])
                      if candle.get("complete") is True
                  ][:limit]

                  payload = {
                      "success": True,
                      "schema_version": "ai-2.0",
                      "generated_at_utc": src.get("generated_at_utc"),
                      "source_commit": source_commit,
                      "pair": pair,
                      "timeframe": tf,
                      "updated_at_utc": tf_block.get("updated_at_utc"),
                      "age_seconds": tf_block.get("age_seconds"),
                      "stale": tf_block.get("stale"),
                      "meta": pair_block.get("meta", {}),
                      "complete_candle_count_source": pair_block.get("complete_candle_count"),
                      "candles": complete,
                  }

                  filename = f"{safe_pair}_{tf}.json"
                  (outdir / filename).write_text(
                      json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8",
                  )
                  files[pair][tf] = f"ai_feed/{filename}"

          index = {
              "success": True,
              "schema_version": "ai-2.0",
              "generated_at_utc": src.get("generated_at_utc"),
              "source_commit": source_commit,
              "pairs": sorted(pairs),
              "limits": limits,
              "files": files,
              "strategy": src.get("strategy", {}),
              "quality": src.get("quality", {}),
          }
          (outdir / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

      - name: Commit AI feed when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ai_feed
          if git diff --cached --quiet; then
            echo "No AI feed changes"
            exit 0
          fi
          git commit -m "Update AI Forex Feed"
          git push
